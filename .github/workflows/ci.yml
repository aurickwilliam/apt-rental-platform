name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.17.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Population command tests
        run: pnpm db:populate:test

      - name: Move-in billing database tests
        run: pnpm db:billing:test

      - name: Listing meter database tests
        run: pnpm db:listing-meter:test

      - name: Activity email tests (isolated PostgreSQL)
        run: pnpm db:activity-emails:test

      - name: Mobile lint
        run: pnpm --filter mobile lint

      - name: Mobile registration database tests
        run: pnpm db:mobile-registration:test

      - name: Mobile tests
        run: pnpm --filter mobile exec jest --runInBand --forceExit

      - name: Web lint
        run: pnpm --filter web lint

      - name: Web typecheck
        run: pnpm --filter web typecheck

      - name: Web tests
        run: pnpm --filter web test

      # The web app self-hosts its Google Fonts: a build (which next/font
      # used to perform at dev/build time against Google's servers) would
      # 500 every page if the font files ever failed to resolve. CI builds
      # with no env set; the app degrades to a warning, not a failure, so
      # keep this step env-less on purpose to catch env-dependent crashes.
      - name: Web build
        run: pnpm --filter web build

      - name: Web registration database tests
        run: pnpm db:web-registration:test

      - name: Auth throttle database tests
        run: pnpm db:auth-throttle:test
