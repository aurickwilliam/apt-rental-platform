# For detailed documentation on config.toml, see:
# https://supabase.com/docs/guides/local-development/config

project_id = "apt-rental-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Mirrors hosted email OTP settings (confirmed 2026-10-13). The templates say the
# code expires in 5 minutes and the mobile resend cooldown is 60s — keep them in sync.
[auth.email]
otp_length = 6
otp_expiry = 300
max_frequency = "60s"

# Mirrors the hosted Email Templates config (Authentication > Emails > Magic link or OTP).
# Local dev only — hosted projects apply via the Management API or the dashboard.
[auth.email.template.magic_link]
subject = "Your APT verification code"
content_path = "./supabase/templates/otp.html"

# Signup verification uses the confirmation flow (sendEmailOtp -> supabase.auth.signUp).
[auth.email.template.confirmation]
subject = "Your APT verification code"
content_path = "./supabase/templates/otp.html"

# Password recovery sends a 6-digit code (resetPasswordForEmail -> verifyOtp type "recovery"), not a link.
[auth.email.template.recovery]
subject = "Reset your APT password"
content_path = "./supabase/templates/recovery.html"

# Security notice sent after any password change (including recovery).
[auth.email.notification.password_changed]
enabled = true
subject = "Your APT password was changed"
content_path = "./supabase/templates/password-changed.html"

# Edge function invoked by the mobile app with the anon key, so JWT
# verification is enforced (default) — the key is checked, not a specific role.
[functions.paymongo]
verify_jwt = true
