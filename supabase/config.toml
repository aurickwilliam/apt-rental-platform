# For detailed documentation on config.toml, see:
# https://supabase.com/docs/guides/local-development/config

project_id = "apt-rental-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Edge function invoked by the mobile app with the anon key, so JWT
# verification is enforced (default) — the key is checked, not a specific role.
[functions.paymongo]
verify_jwt = true
